<!DOCTYPE html>
<html lang="en">
    <body>
    {% block body %}
        <h1>Here is the {{ song.title }} song by {{ song.authors }}</h1>
        <div>Authors: {{ song.authors }}</div>
        <div>Your rating: {{ song.rating }} </div>
        <div>Mean rating: {{ song.average_rating }}</div>
        <div>URL:
            <a href="{{ song.source_url}}">{{ song.source_url}}</a>
        </div>

        <form method="POST" action="/business{{ url_for('rate_song', song_id=song.id) }}">
            <label for="rating">Rate this song (1-10):</label>
            <select name="rating" id="rating" required>
                <option value="" disabled {{ 'selected' if not song.rating else '' }}>-- Select Rating --</option>
                {% for i in range(1, 11) %}
                    <option value="{{ i }}" {{ 'selected' if song.rating == i else '' }}>{{ i }}</option>
                {% endfor %}
            </select>
            <button type="submit">Submit Rating</button>
        </form>
    {% endblock %}
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <body>
        <h1>Add a new song</h1>
        <form method="POST">
            <label for="song_title">Song Name:</label>
            <input type="text" id="song_title" name="song_title" required>

            <label for="source_url">Song URL:</label>
            <input type="text" id="source_url" name="source_url" required>

            <label for="author_name">Author Name:</label>
            <input type="text" id="author_name" name="author_name" required>

            <button type="submit">Add song and author</button>
        </form>
    </body>
</html>

stages:
  - clone+build

default:
  image: docker:19.03
  tags:
    - music_runner

variables:
  GIT_STRATEGY: none  # Prevents automatic git clone
  VERSION: v1.2.1

clone+build:
  stage: clone+build
  script:
    - apk add --no-cache git
    - git clone https://$GIT_USER:$GIT_PASSWORD@gitlab.com/idp_music/AuthService.git
    - git clone https://$GIT_USER:$GIT_PASSWORD@gitlab.com/idp_music/IOService.git
    - git clone https://$GIT_USER:$GIT_PASSWORD@gitlab.com/idp_music/BusinessLogic.git
    - git clone https://$GIT_USER:$GIT_PASSWORD@gitlab.com/idp_music/Database.git
    - ls -la
    - docker build -t auth-service:test ./AuthService
    - docker build -t io-service:test ./IOService
    - docker build -t business-logic:test ./BusinessLogic
    - docker build -t postgres-db:test ./Database

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"    
    # Tag images
    - docker tag auth-service:test $CI_REGISTRY_USER/auth-service:$VERSION
    - docker tag io-service:test $CI_REGISTRY_USER/io-service:$VERSION
    - docker tag business-logic:test $CI_REGISTRY_USER/business-logic:$VERSION
    - docker tag postgres-db:test $CI_REGISTRY_USER/postgres-db:$VERSION
    
    # Push images
    - docker push $CI_REGISTRY_USER/auth-service:$VERSION
    - docker push $CI_REGISTRY_USER/io-service:$VERSION
    - docker push $CI_REGISTRY_USER/business-logic:$VERSION
    - docker push $CI_REGISTRY_USER/postgres-db:$VERSION
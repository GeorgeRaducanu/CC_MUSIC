version: '3.8'

services:
  auth-service:
    build:
      context: ../AuthService
    container_name: auth-service
    ports:
      - "5000:5000"
    depends_on:
      - io-service
      - business-logic
    networks:
      - app-network
    hostname: auth-service

  io-service:
    container_name: io-service
    build:
      context: ../IOService
    ports:
      - "5001:5001"
    depends_on:
      - postgres-db
    networks:
      - app-network
    hostname: io-service

  business-logic:
    container_name: business-logic
    build:
      context: ../BusinessLogic
    ports:
      - "5002:5002"
    networks:
      - app-network
    hostname: business-logic

  postgres-db:
    build:
      context: ../Database
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network

  kong:
    image: kong:latest
    container_name: kong
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "80:8000"
      - "443:8443"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9443:9443" # https
      - "9000:9000" # http
      # Port 8000 for Edge Agent (only needed if managing remote Docker environments via Edge Agent)
      # - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
  
  agent:
    image: portainer/agent:2.11.1 # Pinned version from your example
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounting /var/lib/docker/volumes can be risky, ensure it's needed
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network # Separate network for agent communication
    deploy: # Ignored by docker-compose up
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  # portainer:
  #   image: portainer/portainer-ce:2.11.1 # Pinned version from your example
  #   # Command to connect to agent. 'tasks.agent' likely fails in Compose.
  #   # Try changing 'tasks.agent' to 'agent' if needed, but direct socket mount is better for Compose.
  #   command: -H tcp://agent:9001 --tlsskipverify
  #   ports:
  #     - "9443:9443" # HTTPS UI
  #     - "9000:9000" # HTTP UI (Optional)
  #     # - "8000:8000" # Portainer Edge Agent port (different from this agent)
  #   volumes:
  #     - portainer_data:/data
  #   networks:
  #     - agent_network # Needs to connect to the agent
  #     - app-network   # Optional: Add if Portainer needs to resolve other app services
  #   deploy: # Ignored by docker-compose up
  #     mode: replicated
  #     replicas: 1
  # # --- End Portainer with Agent ---

networks:
  app-network:
    driver: bridge
  agent_network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  portainer_data:
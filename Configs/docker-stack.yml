version: '3.8'

services:
  auth-service:
    image: georgeraducanu2002/auth-service:v1.2.0
    ports:
      - "5000:5000"
    networks:
      - app-network
      - monitoring_network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker

  io-service:
    image: georgeraducanu2002/io-service:v1.2.0
    ports:
      - "5001:5001"
    networks:
      - app-network
      - db_network
      - monitoring_network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker

  business-logic:
    image: georgeraducanu2002/business-logic:v1.2.0
    ports:
      - "5002:5002"
    networks:
      - app-network
      - monitoring_network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker

  postgres-db:
    image: georgeraducanu2002/postgres-db:v1.2.0
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db_network
    deploy:
      placement:
        constraints:
          - node.role == manager

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - db_network
    deploy:
      placement:
        constraints:
          - node.role == manager

  kong:
    image: kong:latest
    configs:
      - source: kong_config
        target: /usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "80:8000"
      - "443:8443"
    networks:
      - app-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  prometheus:
    image: prom/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network
      - monitoring_network
    deploy:
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring_network
    deploy:
      placement:
        constraints:
          - node.role == manager

  agent:
    image: portainer/agent:2.11.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  portainer:
    image: portainer/portainer-ce:2.11.1
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - portainer_data:/data
    networks:
      - agent_network
      - app-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - monitoring_network
    deploy:
      mode: global

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8088:8088"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_network
    deploy:
      mode: global

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-db:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - db_network
      - monitoring_network

networks:
  app-network:
    driver: overlay
  agent_network:
    driver: overlay
  db_network:
    driver: overlay
  monitoring_network:
    driver: overlay

volumes:
  postgres-data:
  grafana-data:
  portainer_data:

configs:
  kong_config:
    file: ./kong.yml
  prometheus_config:
    file: ./prometheus.yml

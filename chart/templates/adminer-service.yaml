{{- if .Values.adminer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: adminer
  labels:
    app: adminer
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: adminer
  ports:
    - port: {{ .Values.adminer.port }}
      targetPort: {{ .Values.adminer.port }}
      protocol: TCP
      nodePort: {{ .Values.adminer.nodePort }}
{{- end }}

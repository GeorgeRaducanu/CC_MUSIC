{{- if .Values.authService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: {{ .Values.authService.port }}
      targetPort: {{ .Values.authService.port }}
      protocol: TCP
      nodePort: {{ .Values.authService.nodePort }}
{{- end }}

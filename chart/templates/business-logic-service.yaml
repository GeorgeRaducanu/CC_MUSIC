{{- if .Values.businessLogic.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: business-logic
  labels:
    app: business-logic
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: business-logic
  ports:
    - port: {{ .Values.businessLogic.port }}
      targetPort: {{ .Values.businessLogic.port }}
      protocol: TCP
      nodePort: {{ .Values.businessLogic.nodePort }}
{{- end }}

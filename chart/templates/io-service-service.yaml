{{- if .Values.ioService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: io-service
  labels:
    app: io-service
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: io-service
  ports:
    - port: {{ .Values.ioService.port }}
      targetPort: {{ .Values.ioService.port }}
      protocol: TCP
      nodePort: {{ .Values.ioService.nodePort }}
{{- end }}

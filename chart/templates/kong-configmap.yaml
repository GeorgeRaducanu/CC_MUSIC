{{- if .Values.kong.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kong-config
  labels:
    {{- include "cc-music.labels" . | nindent 4 }}
data:
  kong.yml: |-
    _format_version: "2.1"

    services:
      - name: auth-service
        url: http://auth-service:{{ .Values.authService.port }}
        routes:
          - name: auth-route
            paths:
              - /auth

      - name: io-service
        url: http://io-service:{{ .Values.ioService.port }}
        routes:
          - name: io-route
            paths:
              - /io

      - name: business-logic
        url: http://business-logic:{{ .Values.businessLogic.port }}
        routes:
          - name: business-route
            paths:
              - /business

    consumers:
      - username: admin
{{- end }}

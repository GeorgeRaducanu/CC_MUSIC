{{- if .Values.kong.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kong
  labels:
    app: kong
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: {{ .Values.kong.ports.proxy }}
      targetPort: {{ .Values.kong.ports.proxy }}
      nodePort: {{ .Values.kong.nodePorts.proxy }}
    - name: admin
      port: {{ .Values.kong.ports.admin }}
      targetPort: {{ .Values.kong.ports.admin }}
      nodePort: {{ .Values.kong.nodePorts.admin }}
{{- end }}

{{- if .Values.portainer.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-portainer-agent
  labels:
    app: portainer-agent
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: portainer-agent
  template:
    metadata:
      labels:
        app: portainer-agent
    spec:
      serviceAccountName: {{ .Release.Name }}-portainer-sa
      containers:
        - name: portainer-agent
          image: {{ .Values.portainer.agentImage }}
          env:
            - name: AGENT_CLUSTER_ADDR
              value: "{{ .Release.Name }}-portainer-agent-headless"
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 9001
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
{{- end }}

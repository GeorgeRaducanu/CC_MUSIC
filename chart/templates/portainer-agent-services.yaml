{{- if .Values.portainer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portainer-agent-headless
  labels:
    app: portainer-agent
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: portainer-agent
  ports:
    - name: agent
      port: 9001
      targetPort: 9001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portainer-agent
  labels:
    app: portainer-agent
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: portainer-agent
  ports:
    - port: 9001
      targetPort: 9001
      protocol: TCP
{{- end }}

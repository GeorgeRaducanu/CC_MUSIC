{{- if .Values.portainer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portainer
  labels:
    app: portainer
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.portainer.replicas }}
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      serviceAccountName: {{ .Release.Name }}-portainer-sa
      containers:
        - name: portainer
          image: {{ .Values.portainer.image }}
          ports:
            - containerPort: {{ .Values.portainer.ports.http }}
            - containerPort: {{ .Values.portainer.ports.https }}
          volumeMounts:
            - name: portainer-data
              mountPath: /data
      volumes:
        - name: portainer-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-portainer-pvc
{{- end }}

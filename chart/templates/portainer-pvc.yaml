{{- if .Values.portainer.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-portainer-pvc
  labels:
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.portainer.storage.size }}
{{- end }}

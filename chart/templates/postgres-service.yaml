{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  labels:
    app: postgres-db
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}

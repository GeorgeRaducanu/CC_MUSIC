# ============================================================================
# ADMINER - Deployment
# ============================================================================
# Interfață grafică pentru administrarea bazei de date PostgreSQL
# Accesibil prin browser pentru interogări și gestiune DB
# ============================================================================

{{- if .Values.adminer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.adminer.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.adminer.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.adminer.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.adminer.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.adminer.name }}
        {{- include "cc-music.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.adminer.name }}
          image: "{{ .Values.adminer.image.repository }}:{{ .Values.adminer.image.tag }}"
          imagePullPolicy: {{ .Values.adminer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.adminer.service.targetPort }}
              protocol: TCP
          env:
            # Configurare pentru conectare la PostgreSQL
            - name: ADMINER_DEFAULT_SERVER
              value: "{{ .Values.postgresql.name }}"
          resources:
            {{- toYaml .Values.adminer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.adminer.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.adminer.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}

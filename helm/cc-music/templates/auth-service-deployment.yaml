# ============================================================================
# AUTH SERVICE - Deployment
# ============================================================================
# Microserviciu de Autentificare și Autorizare
# Gestionează login, register și validarea utilizatorilor
# ============================================================================

{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.authService.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.authService.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.authService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.authService.name }}
        {{- include "cc-music.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.authService.name }}
          image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag }}"
          imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authService.service.targetPort }}
              protocol: TCP
          env:
            - name: FLASK_APP
              value: "{{ .Values.authService.env.FLASK_APP }}"
            - name: FLASK_ENV
              value: "{{ .Values.authService.env.FLASK_ENV }}"
            # Conexiune la IO Service
            - name: IO_SERVICE_URL
              value: "http://{{ .Values.ioService.name }}:{{ .Values.ioService.service.port }}"
            # Conexiune la Business Logic
            - name: BUSINESS_SERVICE_URL
              value: "http://{{ .Values.businessLogic.name }}:{{ .Values.businessLogic.service.port }}"
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.authService.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.authService.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}

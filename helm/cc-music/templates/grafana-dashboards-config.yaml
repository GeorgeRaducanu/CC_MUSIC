# ============================================================================
# GRAFANA - ConfigMap pentru Dashboard Provider
# ============================================================================

{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.name }}-dashboards-config
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.grafana.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'CC_MUSIC Dashboards'
        orgId: 1
        folder: 'CC_MUSIC'
        folderUid: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
{{- end }}

              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "9.5.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",

              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.5.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "time() - process_start_time_seconds{job=\"prometheus\"}",
              "legendFormat": "Uptime",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Prometheus Uptime",
          "type": "stat"

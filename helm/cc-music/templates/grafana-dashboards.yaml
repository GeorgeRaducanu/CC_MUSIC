# ============================================================================
# GRAFANA - ConfigMap pentru Dashboards
# ============================================================================
# Dashboard pre-configurat pentru monitorizarea aplicației CC_MUSIC
# ============================================================================

{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.name }}-dashboards
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.grafana.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
data:
  cc-music-dashboard.json: |

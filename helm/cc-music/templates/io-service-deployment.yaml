# ============================================================================
# IO SERVICE - Deployment
# ============================================================================
# Microserviciu pentru operații I/O cu baza de date
# Oferă API pentru CRUD operations
# ============================================================================

{{- if .Values.ioService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ioService.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.ioService.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ioService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.ioService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.ioService.name }}
        {{- include "cc-music.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.ioService.name }}
          image: "{{ .Values.ioService.image.repository }}:{{ .Values.ioService.image.tag }}"
          imagePullPolicy: {{ .Values.ioService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ioService.service.targetPort }}
              protocol: TCP
          env:
            - name: FLASK_APP
              value: "{{ .Values.ioService.env.FLASK_APP }}"
            - name: FLASK_ENV
              value: "{{ .Values.ioService.env.FLASK_ENV }}"
            # Conexiune la baza de date PostgreSQL
            - name: DATABASE_HOST
              value: "{{ .Values.postgresql.name }}"
            - name: DATABASE_PORT
              value: "{{ .Values.postgresql.service.port }}"
            - name: DATABASE_NAME
              value: "{{ .Values.postgresql.auth.database }}"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          resources:
            {{- toYaml .Values.ioService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ioService.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ioService.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}

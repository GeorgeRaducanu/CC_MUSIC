{{- if .Values.kong.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: {{ include "cc-music.namespace" . }}
data:
  kong.yml: |
    _format_version: "2.1"

    services:
      - name: auth-service
        url: http://{{ .Values.authService.name }}:{{ .Values.authService.service.port }}
        routes:
          - name: auth-route
            paths:
              - /auth
            strip_path: true

      - name: io-service
        url: http://{{ .Values.ioService.name }}:{{ .Values.ioService.service.port }}
        routes:
          - name: io-route
            paths:
              - /io
            strip_path: true

      - name: business-logic
        url: http://{{ .Values.businessLogic.name }}:{{ .Values.businessLogic.service.port }}
        routes:
          - name: business-route
            paths:
              - /business
            strip_path: true
{{- end }}

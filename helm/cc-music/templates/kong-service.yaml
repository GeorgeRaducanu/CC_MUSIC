{{- if .Values.kong.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kong.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.kong.name }}
spec:
  type: {{ .Values.kong.service.type }}
  ports:
    - name: proxy
      port: {{ .Values.kong.service.port }}
      targetPort: 8000
      {{- if eq .Values.kong.service.type "NodePort" }}
      nodePort: {{ .Values.kong.service.nodePort }}
      {{- end }}
    - name: admin
      port: {{ .Values.kong.service.adminPort }}
      targetPort: 8001
  selector:
    app: {{ .Values.kong.name }}
{{- end }}

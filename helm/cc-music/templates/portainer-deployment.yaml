# ============================================================================
# PORTAINER - Deployment
# ============================================================================
# Instrument vizual pentru gestiunea clusterului Kubernetes
# Oferă imagine asupra resurselor: pods, servicii, volume
# ============================================================================

{{- if .Values.portainer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.portainer.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.portainer.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.portainer.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.portainer.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.portainer.name }}
        {{- include "cc-music.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.portainer.name }}-sa
      containers:
        - name: {{ .Values.portainer.name }}
          image: "{{ .Values.portainer.image.repository }}:{{ .Values.portainer.image.tag }}"
          imagePullPolicy: {{ .Values.portainer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.portainer.service.port }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.portainer.service.httpsPort }}
              protocol: TCP
          volumeMounts:
            - name: portainer-data
              mountPath: /data
          resources:
            {{- toYaml .Values.portainer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.portainer.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.portainer.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        {{- if .Values.portainer.persistence.enabled }}
        - name: portainer-data
          persistentVolumeClaim:
            claimName: {{ .Values.portainer.name }}-pvc
        {{- else }}
        - name: portainer-data
          emptyDir: {}
        {{- end }}
{{- end }}

# ============================================================================
# PORTAINER - ServiceAccount și RBAC
# ============================================================================
# Portainer necesită permisiuni pentru a gestiona resursele Kubernetes
# ============================================================================

{{- if .Values.portainer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.portainer.name }}-sa
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.portainer.name }}
    {{- include "cc-music.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.portainer.name }}-crb
  labels:
    app: {{ .Values.portainer.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.portainer.name }}-sa
    namespace: {{ include "cc-music.namespace" . }}
{{- end }}

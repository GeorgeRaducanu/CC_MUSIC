# ============================================================================
# PORTAINER - Service
# ============================================================================

{{- if .Values.portainer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.portainer.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.portainer.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  type: {{ .Values.portainer.service.type }}
  ports:
    - port: {{ .Values.portainer.service.port }}
      targetPort: {{ .Values.portainer.service.port }}
      protocol: TCP
      name: http
      {{- if eq .Values.portainer.service.type "NodePort" }}
      nodePort: {{ .Values.portainer.service.nodePort }}
      {{- end }}
    - port: {{ .Values.portainer.service.httpsPort }}
      targetPort: {{ .Values.portainer.service.httpsPort }}
      protocol: TCP
      name: https
      {{- if eq .Values.portainer.service.type "NodePort" }}
      nodePort: {{ .Values.portainer.service.httpsNodePort }}
      {{- end }}
  selector:
    app: {{ .Values.portainer.name }}
{{- end }}

# ============================================================================
# POSTGRESQL - ConfigMap pentru Script de Inițializare
# ============================================================================
# Conține schema SQL pentru inițializarea bazei de date
# Schema-ul este încărcat din files/schema.sql (copiat din Database/schema.sql)
# ============================================================================

{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.postgresql.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
data:
  schema.sql: |
{{ .Files.Get "files/schema.sql" | indent 4 }}
{{- end }}

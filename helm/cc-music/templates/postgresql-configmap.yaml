# ============================================================================
# POSTGRESQL - ConfigMap pentru Script de Inițializare
# ============================================================================
# Conține schema SQL pentru inițializarea bazei de date
# ============================================================================

{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.postgresql.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
data:
  schema.sql: |
    -- ============================================================================
    -- CC_MUSIC Database Schema
    -- ============================================================================
    
    CREATE TABLE IF NOT EXISTS authors (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL UNIQUE
    );

    CREATE TABLE IF NOT EXISTS folders (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS songs (
        id SERIAL PRIMARY KEY,
        title TEXT NOT NULL,
        source_url TEXT NULL
    );

    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username TEXT NOT NULL UNIQUE,
        password TEXT NOT NULL,
        email TEXT NOT NULL UNIQUE,
        role TEXT NOT NULL DEFAULT 'user' CHECK(role IN ('admin', 'user'))
    );

    CREATE TABLE IF NOT EXISTS user_folders (
        user_id INTEGER NOT NULL,
        folder_id INTEGER NOT NULL,
        PRIMARY KEY (user_id, folder_id),
        FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY(folder_id) REFERENCES folders(id) ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS folder_songs (
        folder_id INTEGER NOT NULL,
        song_id INTEGER NOT NULL,
        PRIMARY KEY (folder_id, song_id),
        FOREIGN KEY(folder_id) REFERENCES folders(id) ON DELETE CASCADE,
        FOREIGN KEY(song_id) REFERENCES songs(id) ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS song_authors (
        song_id INTEGER NOT NULL,
        author_id INTEGER NOT NULL,
        PRIMARY KEY (song_id, author_id),
        FOREIGN KEY(song_id) REFERENCES songs(id),
        FOREIGN KEY(author_id) REFERENCES authors(id)
    );

    CREATE TABLE IF NOT EXISTS song_ratings (
        song_id INTEGER NOT NULL,
        user_id INTEGER NOT NULL,
        rating INTEGER NOT NULL CHECK(rating BETWEEN 1 AND 10),
        PRIMARY KEY (song_id, user_id),
        FOREIGN KEY(song_id) REFERENCES songs(id) ON DELETE CASCADE,
        FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE
    );

    -- Index pentru căutări rapide
    CREATE INDEX IF NOT EXISTS idx_songs_title ON songs(title);
    CREATE INDEX IF NOT EXISTS idx_folders_name ON folders(name);

    -- Insert date de test
    INSERT INTO users (username, password, email, role) VALUES 
        ('admin', 'admin', 'admin@ccmusic.local', 'admin'),
        ('test', 'test', 'test@ccmusic.local', 'user')
    ON CONFLICT (username) DO NOTHING;
{{- end }}

# ============================================================================
# POSTGRESQL - Secret
# ============================================================================
# Conține credențialele pentru baza de date PostgreSQL
# IMPORTANT: În producție, folosiți un secrets manager extern!
# ============================================================================

{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.postgresql.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
type: Opaque
data:
  # Credențialele sunt encodate în Base64
  # Decodare: echo "YWRtaW4=" | base64 -d
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}

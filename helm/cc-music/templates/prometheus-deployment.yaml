# ============================================================================
# PROMETHEUS - Deployment
# ============================================================================
# Sistem de monitorizare și alertare pentru colectarea metricilor
# ============================================================================

{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prometheus.name }}
  namespace: {{ include "cc-music.namespace" . }}
  labels:
    app: {{ .Values.prometheus.name }}
    {{- include "cc-music.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.prometheus.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.prometheus.name }}
        {{- include "cc-music.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.prometheus.name }}-sa
      containers:
        - name: {{ .Values.prometheus.name }}
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/consoles"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: {{ .Values.prometheus.service.targetPort }}
              protocol: TCP
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: {{ .Values.prometheus.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: {{ .Values.prometheus.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: prometheus-config
          configMap:
            name: {{ .Values.prometheus.name }}-config
        {{- if .Values.prometheus.persistence.enabled }}
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: {{ .Values.prometheus.name }}-pvc
        {{- else }}
        - name: prometheus-data
          emptyDir: {}
        {{- end }}
{{- end }}

# ============================================================================
# CC_MUSIC - Fișier de Configurare Centralizat (values.yaml)
# ============================================================================
# Toate parametrii aplicației sunt centralizați aici pentru ușurință în
# gestionare și actualizare. Modifică valorile aici pentru a customiza
# deployment-ul fără a modifica template-urile.
# ============================================================================

# ----------------------------------------------------------------------------
# CONFIGURĂRI GLOBALE
# ----------------------------------------------------------------------------
global:
  # Namespace-ul Kubernetes (poate fi suprascris la instalare)
  namespace: cc-music
  
  # Politica de pull pentru imagini
  # - Always: întotdeauna descarcă imaginea (recomandat pentru development)
  # - IfNotPresent: descarcă doar dacă nu există local
  # - Never: folosește doar imagini locale (pentru Kind)
  imagePullPolicy: Never
  
  # Registry pentru imagini Docker (lasă gol pentru imagini locale)
  imageRegistry: ""

# ----------------------------------------------------------------------------
# KONG API GATEWAY
# ----------------------------------------------------------------------------
kong:
  enabled: true
  name: kong
  
  image:
    repository: kong
    tag: "3.4"
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: NodePort
    port: 8000
    adminPort: 8001
    nodePort: 30800
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# ----------------------------------------------------------------------------
# AUTH SERVICE - Microserviciu de Autentificare și Autorizare
# ----------------------------------------------------------------------------
authService:
  enabled: true
  name: auth-service
  
  # Configurare imagine Docker
  image:
    repository: georgeraducanu2002/authservice
    tag: latest
    pullPolicy: IfNotPresent
  
  # Numărul de replici (instanțe)
  replicaCount: 1
  
  # Configurare porturi
  service:
    type: ClusterIP        # ClusterIP, NodePort, sau LoadBalancer
    port: 5000             # Port extern al serviciului
    targetPort: 5000       # Port pe care rulează containerul
    nodePort: 30500        # Port NodePort (doar dacă type: NodePort)
  
  # Resurse alocate containerului
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  # Environment variables
  env:
    FLASK_APP: "auth.py"
    FLASK_ENV: "production"

# ----------------------------------------------------------------------------
# IO SERVICE - Microserviciu pentru operații I/O cu baza de date
# ----------------------------------------------------------------------------
ioService:
  enabled: true
  name: io-service
  
  image:
    repository: georgeraducanu2002/ioservice
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001
    nodePort: 30501
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  env:
    FLASK_APP: "io_service.py"
    FLASK_ENV: "production"

# ----------------------------------------------------------------------------
# BUSINESS LOGIC - Microserviciu principal de Business Logic
# ----------------------------------------------------------------------------
businessLogic:
  enabled: true
  name: business-logic
  
  image:
    repository: georgeraducanu2002/businesslogic
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 5002
    targetPort: 5002
    nodePort: 30502
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  env:
    FLASK_APP: "business.py"
    FLASK_ENV: "production"

# ----------------------------------------------------------------------------
# POSTGRESQL - Baza de Date
# ----------------------------------------------------------------------------
postgresql:
  enabled: true
  name: postgres-db
  
  image:
    repository: postgres
    tag: "13"
    pullPolicy: IfNotPresent
  
  # Credențiale bază de date (IMPORTANT: schimbă în producție!)
  auth:
    username: admin
    password: admin
    database: CC_music
  
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
    nodePort: 30432
  
  # Configurare volum persistent
  persistence:
    enabled: true
    storageClass: ""       # Lasă gol pentru default storage class
    accessMode: ReadWriteOnce
    size: 1Gi
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ----------------------------------------------------------------------------
# ADMINER - Interfață Grafică pentru Administrare Bază de Date
# ----------------------------------------------------------------------------
adminer:
  enabled: true
  name: adminer
  
  image:
    repository: adminer
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# ----------------------------------------------------------------------------
# PORTAINER - Gestiune Vizuală a Clusterului
# ----------------------------------------------------------------------------
portainer:
  enabled: true
  name: portainer
  
  image:
    repository: portainer/portainer-ce
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: NodePort
    port: 9000
    targetPort: 9000
    nodePort: 30900
    # Port HTTPS
    httpsPort: 9443
    httpsNodePort: 30943
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------------------------
# PROMETHEUS - Colectare Metrici
# ----------------------------------------------------------------------------
prometheus:
  enabled: true
  name: prometheus
  
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: NodePort
    port: 9090
    targetPort: 9090
    nodePort: 30909
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Interval de scraping (în secunde)
  scrapeInterval: 15s

# ----------------------------------------------------------------------------
# GRAFANA - Vizualizare Metrici
# ----------------------------------------------------------------------------
grafana:
  enabled: true
  name: grafana
  
  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30300
  
  # Credențiale admin (IMPORTANT: schimbă în producție!)
  admin:
    user: admin
    password: admin
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------------------------
# INGRESS - Configurare Acces Extern (Opțional)
# ----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: cc-music.local
      paths:
        - path: /auth
          pathType: Prefix
          service: auth-service
          port: 5000
        - path: /io
          pathType: Prefix
          service: io-service
          port: 5001
        - path: /business
          pathType: Prefix
          service: business-logic
          port: 5002
  tls: []

# ----------------------------------------------------------------------------
# SERVICE ACCOUNT (Opțional)
# ----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: cc-music-sa
  annotations: {}

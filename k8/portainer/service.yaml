apiVersion: v1
kind: Service
metadata:
  name: portainer
  labels:
    app: portainer
spec:
  type: NodePort
  selector:
    app: portainer
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30900
      protocol: TCP
    - name: https
      port: 9443
      targetPort: 9443
      nodePort: 30943
      protocol: TCP